receivers:
  otlp:
    protocols:
      # Explicit endpoints: since 0.104 the default is localhost, unreachable from the API container.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"

  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
