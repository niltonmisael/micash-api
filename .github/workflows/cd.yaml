
name: CD

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

concurrency:
  group: cd
  cancel-in-progress: false

env:
  IMAGE_NAME: micash-api

jobs:
  validate-version:
    name: Valida versão
    runs-on: ubuntu-latest
    steps:
      - name: Valida formato SemVer
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag inválida: $VERSION"
            echo "Formato esperado: v1.0.0"
            exit 1
          fi

  tests:
    name: Testes
    needs: validate-version
    uses: ./.github/workflows/ci.yaml
    with:
      build-image: false

  publish:
    name: Publica imagem no GHCR
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .deployment/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Atualiza API na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/micash/api

            export MICASH_API_TAG='${{ github.ref_name }}'

            echo "Baixando imagem ${MICASH_API_TAG}..."
            docker compose -f docker-compose.prod.yml pull api

            echo "Atualizando container da API..."
            docker compose -f docker-compose.prod.yml up -d --no-deps api

            echo "Aguardando API ficar saudável..."

            for i in $(seq 1 36); do
              STATUS=$(docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                micash-api 2>/dev/null || true)

              echo "Status: ${STATUS}"

              if [ "$STATUS" = "healthy" ]; then
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                docker logs --tail 100 micash-api
                exit 1
              fi

              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              docker logs --tail 100 micash-api
              echo "A API não ficou saudável dentro do tempo esperado."
              exit 1
            fi

            echo "Validando HTTPS público e certificado TLS..."

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --retry 6 \
              --retry-delay 5 \
              --retry-connrefused \
              https://api.micash.com.br/health)

            echo "Status HTTP público: ${HTTP_STATUS}"

            if [ "$HTTP_STATUS" != "404" ]; then
              echo "Resposta inesperada. Esperado HTTP 404 para o endpoint privado /health."
              exit 1
            fi

            echo "HTTPS válido, endpoint privado protegido e API saudável."
            echo "Deploy concluído com sucesso!"
