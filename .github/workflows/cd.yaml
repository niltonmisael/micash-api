name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

# Two tags at once publish in order, never in parallel.
concurrency:
  group: cd
  cancel-in-progress: false

env:
  IMAGE_NAME: micash-api

jobs:
  tests:
    name: Testes
    uses: ./.github/workflows/ci.yaml
    with:
      build-image: false

  publish:
    name: Publica imagem no GHCR
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags (v1.2.3 and latest) and OCI labels: links the package to the repo, commit and version.
      - name: Metadata da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .deployment/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

