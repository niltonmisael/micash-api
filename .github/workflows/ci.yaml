name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  # Reused by the CD: an image is only published after the tests pass.
  workflow_call:
    inputs:
      build-image:
        description: Also build the Docker image (without publishing).
        type: boolean
        default: true

permissions:
  contents: read

# A new push to the same PR/branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  docker:
    name: Build da imagem Docker
    # On PR/push it validates the Dockerfile; the CD skips it (it builds the image itself).
    if: ${{ github.event_name != 'workflow_call' || inputs.build-image != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .deployment/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
